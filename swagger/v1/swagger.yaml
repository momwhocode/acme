---
openapi: 3.0.1
info:
  title: ACME Salary Management API
  version: v1
  description: |
    JSON API for the HR manager. Cookie session after `POST /api/v1/session`.
    Mutating requests need `X-CSRF-Token` from `meta.csrf_token` when CSRF is on.
    Success bodies are `{ data, meta? }`. Errors are `{ error: { code, message, details? } }`.
    Health and these docs are public. Everything else requires a signed-in HR session.
servers:
- url: http://localhost:3000
  description: Local development
tags:
- name: Health
  description: Liveness. No session.
- name: Session
  description: HR login, current user, logout.
- name: Employees
  description: Directory, onboard, import, export, rehire, and delete.
- name: Compensation
  description: Effective-dated raises, corrections, and pay-row deletes.
- name: Analytics
  description: as_of payroll snapshot with mix filters and action queues.
- name: Errors
  description: Shared envelope. Unknown `/api` routes are 404. Malformed JSON is 400
    invalid_request. Unexpected failures are 500 internal_error and never leak the
    exception.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: _acme_session
      description: Set by POST /api/v1/session. Swagger UI reuses it on the same origin.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: csrf_token from the session response. Required when CSRF protection
        is on.
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    ValidationError:
      "$ref": "#/components/schemas/Error"
    Meta:
      type: object
      properties:
        csrf_token:
          type: string
        pagination:
          "$ref": "#/components/schemas/Pagination"
        facets:
          type: object
          properties:
            departments:
              type: array
              items:
                type: string
            countries:
              type: array
              items:
                type: string
            managers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
    User:
      type: object
      required:
      - id
      - email
      - first_name
      - last_name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
    Session:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - user
          properties:
            user:
              "$ref": "#/components/schemas/User"
        meta:
          "$ref": "#/components/schemas/Meta"
    Logout:
      type: object
      required:
      - data
      properties:
        data:
          type: object
        meta:
          "$ref": "#/components/schemas/Meta"
    Health:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - status
          - app
          properties:
            status:
              type: string
              example: ok
            app:
              type: string
              example: acme
    Employee:
      type: object
      required:
      - id
      - first_name
      - last_name
      - email
      - country
      - department
      - employment_type
      - status
      - started_on
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        country:
          type: string
          minLength: 2
          maxLength: 2
          example: GB
        department:
          type: string
          example: engineering
        employment_type:
          type: string
          enum:
          - full-time
          - part-time
          - contractor
          - freelancer
          - intern
        status:
          type: string
          enum:
          - active
          - left
        level:
          type: string
          nullable: true
        started_on:
          type: string
          format: date
        left_on:
          type: string
          format: date
          nullable: true
        manager_id:
          type: string
          format: uuid
          nullable: true
        manager_name:
          type: string
          nullable: true
        current_compensation:
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/CompensationRecord"
    Decimal:
      description: Rails may serialize decimals as a number or a string.
      oneOf:
      - type: string
      - type: number
    CompensationRecord:
      type: object
      required:
      - id
      - employee_id
      - base_amount
      - currency
      - pay_period
      - effective_date
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        base_amount:
          "$ref": "#/components/schemas/Decimal"
        currency:
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - INR
        pay_period:
          type: string
          enum:
          - hourly
          - daily
          - monthly
          - annual
        hours_per_week:
          "$ref": "#/components/schemas/Decimal"
          nullable: true
        effective_date:
          type: string
          format: date
        change_reason:
          type: string
          nullable: true
        annualised_usd:
          "$ref": "#/components/schemas/Decimal"
    EmployeeProfile:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - employee
          - compensation_records
          properties:
            employee:
              "$ref": "#/components/schemas/Employee"
            current_compensation:
              nullable: true
              allOf:
              - "$ref": "#/components/schemas/CompensationRecord"
            compensation_records:
              type: array
              items:
                "$ref": "#/components/schemas/CompensationRecord"
            pay_band:
              nullable: true
              type: object
              properties:
                level:
                  type: string
                currency:
                  type: string
                midpoint:
                  "$ref": "#/components/schemas/Decimal"
                compa_ratio:
                  "$ref": "#/components/schemas/Decimal"
                  nullable: true
            audit_events:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  action:
                    type: string
                  record_type:
                    type: string
                  record_id:
                    type: string
                    format: uuid
                  payload:
                    type: object
                  actor_name:
                    type: string
                  created_at:
                    type: string
                    format: date-time
    Pagination:
      type: object
      required:
      - page
      - pages
      - count
      - limit
      properties:
        page:
          type: integer
        pages:
          type: integer
        count:
          type: integer
        limit:
          type: integer
    DirectoryPage:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - employees
          properties:
            employees:
              type: array
              items:
                "$ref": "#/components/schemas/Employee"
        meta:
          "$ref": "#/components/schemas/Meta"
    HireResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - employee
          - compensation_record
          properties:
            employee:
              "$ref": "#/components/schemas/Employee"
            compensation_record:
              "$ref": "#/components/schemas/CompensationRecord"
    CompensationCorrectionResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - compensation_record
          properties:
            compensation_record:
              "$ref": "#/components/schemas/CompensationRecord"
    CompensationChangeResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - compensation_record
          - employee
          properties:
            compensation_record:
              "$ref": "#/components/schemas/CompensationRecord"
            employee:
              "$ref": "#/components/schemas/Employee"
    ImportResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - employees
          - compensation_records
          properties:
            employees:
              type: integer
              example: 2
            compensation_records:
              type: integer
              example: 3
            updated:
              type: integer
              example: 0
    OffboardResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - employee
          properties:
            employee:
              "$ref": "#/components/schemas/Employee"
    CompensationInput:
      type: object
      required:
      - base_amount
      - currency
      - pay_period
      properties:
        base_amount:
          type: number
          minimum: 0
          example: 80000
        currency:
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - INR
        pay_period:
          type: string
          enum:
          - hourly
          - daily
          - monthly
          - annual
        hours_per_week:
          type: number
          exclusiveMinimum: 0
          maximum: 168
        effective_date:
          type: string
          format: date
        change_reason:
          type: string
          maxLength: 255
    OnboardRequest:
      type: object
      required:
      - first_name
      - last_name
      - email
      - country
      - department
      - employment_type
      - started_on
      - compensation
      properties:
        first_name:
          type: string
          example: Ada
        last_name:
          type: string
          example: Lovelace
        email:
          type: string
          format: email
          example: ada@acme.test
        country:
          type: string
          example: GB
        department:
          type: string
          example: engineering
        employment_type:
          type: string
          enum:
          - full-time
          - part-time
          - contractor
          - freelancer
          - intern
        level:
          type: string
          example: IC2
        started_on:
          type: string
          format: date
          example: '2024-01-01'
        compensation:
          "$ref": "#/components/schemas/CompensationInput"
    CompensationChangeRequest:
      allOf:
      - "$ref": "#/components/schemas/CompensationInput"
      - type: object
        properties:
          effective_date:
            type: string
            format: date
            example: '2025-04-01'
          change_reason:
            type: string
            example: promotion
          level:
            type: string
            example: IC3
    EmployeeUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
          example: Grace
        last_name:
          type: string
          example: Hopper
        email:
          type: string
          format: email
          example: grace@acme.test
        country:
          type: string
          example: US
        department:
          type: string
          example: sales
        employment_type:
          type: string
          enum:
          - full-time
          - part-time
          - contractor
          - freelancer
          - intern
        level:
          type: string
          nullable: true
          example: IC3
        started_on:
          type: string
          format: date
          example: '2024-01-01'
        manager_id:
          type: string
          format: uuid
          nullable: true
    OffboardRequest:
      type: object
      required:
      - left_on
      properties:
        left_on:
          type: string
          format: date
          example: '2025-06-01'
    AnalyticsMix:
      type: object
      required:
      - headcount
      properties:
        employment_type:
          type: string
          example: full-time
        department:
          type: string
          example: engineering
        country:
          type: string
          example: GB
        currency:
          type: string
          example: GBP
        headcount:
          type: integer
          example: 120
        payroll_usd:
          "$ref": "#/components/schemas/Decimal"
        payroll_local:
          "$ref": "#/components/schemas/Decimal"
    Analytics:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - annualised_usd
          - by_type
          - by_department
          properties:
            headcount:
              type: integer
            annualised_usd:
              "$ref": "#/components/schemas/Decimal"
            median_usd:
              allOf:
              - "$ref": "#/components/schemas/Decimal"
              nullable: true
            by_type:
              type: array
              items:
                "$ref": "#/components/schemas/AnalyticsMix"
            by_department:
              type: array
              items:
                "$ref": "#/components/schemas/AnalyticsMix"
            by_country:
              type: array
              items:
                "$ref": "#/components/schemas/AnalyticsMix"
            by_level:
              type: array
              items:
                "$ref": "#/components/schemas/AnalyticsMix"
            actions:
              type: object
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: hr@acme.test
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
paths:
  "/api/v1/analytics":
    get:
      summary: HR analytics snapshot
      tags:
      - Analytics
      description: as_of snapshot over employment dates. Mix filters refetch the same
        window.
      parameters:
      - name: as_of
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Snapshot date. Defaults to today.
      - name: country
        in: query
        required: false
        schema:
          type: string
      - name: department
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: level
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: metrics
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Analytics"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/employees/{employee_id}/compensation_records":
    parameters:
    - name: employee_id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    post:
      summary: Record a raise or promotion
      tags:
      - Compensation
      description: Appends an effective-dated pay row. Optional level updates the
        employee. Rejected for leavers.
      parameters: []
      responses:
        '201':
          description: pay change recorded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompensationChangeResponse"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown employee
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: invalid pay change
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CompensationChangeRequest"
  "/api/v1/employees/{employee_id}/compensation_records/{id}":
    parameters:
    - name: employee_id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    patch:
      summary: Correct a pay row
      tags:
      - Compensation
      description: In-place correction. New raises still POST a new row.
      parameters: []
      responses:
        '200':
          description: corrected
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompensationCorrectionResponse"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: no fields to update
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CompensationInput"
    delete:
      summary: Delete a pay row
      tags:
      - Compensation
      description: Removes one row. The hire must keep at least one compensation record.
      responses:
        '200':
          description: deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Logout"
        '422':
          description: only pay record
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/employees":
    get:
      summary: List the directory
      tags:
      - Employees
      description: Server-paginated. Filters use the directory index. `q` is trigram
        search on name and email.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: country
        in: query
        required: false
        schema:
          type: string
          minLength: 2
          maxLength: 2
      - name: department
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - full-time
          - part-time
          - contractor
          - freelancer
          - intern
      - name: employment_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - full-time
          - part-time
          - contractor
          - freelancer
          - intern
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - left
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
      - name: manager
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: level
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: page of employees
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DirectoryPage"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: invalid filter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '500':
          description: internal error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Onboard an employee
      tags:
      - Employees
      description: Creates an active employee and the first compensation row in one
        transaction.
      parameters: []
      responses:
        '201':
          description: hired
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HireResponse"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: invalid hire
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OnboardRequest"
  "/api/v1/employees/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    get:
      summary: Show an employee profile
      tags:
      - Employees
      description: Current compensation plus newest-first effective-dated history.
        Amounts include annualised USD.
      responses:
        '200':
          description: profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmployeeProfile"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown employee
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update employee identity
      tags:
      - Employees
      description: Edits profile fields. Status and leave date stay on offboard. Compensation
        stays on the pay-change endpoint.
      parameters: []
      responses:
        '200':
          description: updated profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmployeeProfile"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown employee
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: cannot update
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmployeeUpdateRequest"
    delete:
      summary: Delete a hire
      tags:
      - Employees
      description: Hard-deletes a mistaken hire and their compensation rows. Audit
        events stay.
      responses:
        '200':
          description: deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Logout"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown employee
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/employees/import":
    post:
      summary: Import a directory CSV
      tags:
      - Employees
      description: Creates employees and effective-dated compensation. Existing emails
        are updated. Max 5 MB.
      parameters: []
      responses:
        '200':
          description: imported
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportResponse"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: cannot import
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
              format: binary
        required: true
  "/api/v1/employees/{id}/offboard":
    parameters:
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    patch:
      summary: Mark a leaver
      tags:
      - Employees
      description: Sets status to left. left_on must be ISO-8601 and cover every compensation
        date.
      parameters: []
      responses:
        '200':
          description: marked left
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OffboardResponse"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown employee
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: cannot offboard
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OffboardRequest"
  "/api/v1/employees/{id}/rehire":
    parameters:
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    patch:
      summary: Rehire a leaver
      tags:
      - Employees
      description: Sets status back to active and clears left_on. started_on does
        not move.
      responses:
        '200':
          description: reactivated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmployeeProfile"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: already active
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/employees/export":
    get:
      summary: Export this directory view
      tags:
      - Employees
      description: CSV of the current filters. Same query params as the listing, no
        pagination.
      parameters:
      - name: country
        in: query
        required: false
        schema:
          type: string
          minLength: 2
          maxLength: 2
      responses:
        '200':
          description: csv
        '401':
          description: not signed in
          content:
            text/csv:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/{unmatched}":
    parameters:
    - name: unmatched
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Unknown API route
      tags:
      - Errors
      description: Any unmatched `/api` path returns the shared error envelope.
      responses:
        '404':
          description: route not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/health":
    get:
      summary: Liveness check
      tags:
      - Health
      description: Public. Used by the signed-in home page and load balancers.
      responses:
        '200':
          description: service is up
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
  "/api/v1/session":
    post:
      summary: Sign in
      tags:
      - Session
      description: Creates a cookie session and returns a CSRF token. Email is matched
        case-insensitively.
      parameters: []
      responses:
        '201':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: CSRF token missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
    get:
      summary: Current HR user
      tags:
      - Session
      description: Requires a session cookie.
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      summary: Sign out
      tags:
      - Session
      description: Always succeeds. Clears the session when one exists.
      responses:
        '200':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Logout"
