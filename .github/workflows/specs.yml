name: Specs

on:
  workflow_call:

jobs:
  backend:
    name: Backend specs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      # 127.0.0.1 avoids CI resolving localhost to IPv6 (::1) while Postgres is IPv4-only.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/acme_test
      SECRET_KEY_BASE: test-secret-key-base
      TZ: UTC
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare database
        # schema:load only — db:prepare also runs db/seeds.rb on a new database.
        run: bin/rails db:create db:schema:load

      - name: RSpec
        run: bundle exec rspec

  frontend:
    name: Frontend specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Vitest
        run: npm test
