<!DOCTYPE html>
<html lang="en">
<head>
  <title>Page not found · Acme Salary Management</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: clamp(16px, 4vw, 56px);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: #101828;
      background: #ffffff;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 28rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
    }
    .wordmark { margin: 0; font-size: 20px; font-weight: 600; line-height: 28px; }
    h1 { margin: 0; font-size: 30px; font-weight: 600; line-height: 38px; }
    p { margin: 0; font-size: 16px; line-height: 24px; color: #364153; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      text-decoration: none;
    }
    .primary { background: #631240; color: #ffffff; }
    .outlined { background: #ffffff; color: #364153; border: 1px solid #d1d5dc; }
    footer {
      display: flex;
      justify-content: center;
      color: #364153;
      font-size: 14px;
      line-height: 20px;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <p class="wordmark">Acme</p>
      <h1>Page not found</h1>
      <p>This page isn't available. Head back home or sign in.</p>
      <div class="actions">
        <a class="outlined" href="/">Back to home</a>
        <a class="primary" href="/sign_in">Sign in</a>
      </div>
    </div>
  </main>
  <footer>© ACME. All rights reserved.</footer>
</body>
</html>
