# PostgreSQL. Hosted DATABASE_URL still wins when the platform injects it.
# App password lives in credentials (`database.password`), not ENV.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: acme_development

test:
  <<: *default
  database: acme_test

production:
  <<: *default
  database: acme_production
  username: acme
  password: <%= begin
    Rails.application.credentials.dig(:database, :password)
  rescue ActiveSupport::EncryptedFile::MissingKeyError, ActiveSupport::MessageEncryptor::InvalidMessage
    nil
  end %>
