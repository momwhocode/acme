# PostgreSQL. DATABASE_URL wins in hosted environments.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: acme_development

test:
  <<: *default
  database: acme_test

production:
  <<: *default
  database: acme_production
  username: acme
  password: <%= ENV["ACME_DATABASE_PASSWORD"] %>
