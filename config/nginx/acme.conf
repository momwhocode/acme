upstream acme_puma {
  server unix:/var/www/acme/shared/tmp/sockets/puma.sock fail_timeout=0;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name 15.252.167.21;
  server_tokens off;

  root /var/www/acme/current/public;
  client_max_body_size 10m;

  location ^~ /vite/ {
    gzip_static on;
    expires 1y;
    add_header Cache-Control public;
    try_files $uri =404;
  }

  location ^~ /assets/ {
    gzip_static on;
    expires 1y;
    add_header Cache-Control public;
    try_files $uri =404;
  }

  try_files $uri @puma;

  location @puma {
    proxy_pass http://acme_puma;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect off;
  }
}
